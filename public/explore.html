<!DOCTYPE html>
<html>
<head>
  <title>Explore Playlists</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    .playlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin: 20px 0; }
    .playlist-card { background: #1a1a1a; padding: 15px; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
    .playlist-card:hover { transform: translateY(-5px); background: #262626; }
    .playlist-card h4 { color: #4fc3f7; margin: 0; }
    .playlist-card p { font-size: 12px; color: #999; margin: 5px 0; }
    .playlist-card button { width: 100%; padding: 8px; background: #ff4081; color: white; border: none; border-radius: 3px; cursor: pointer; margin-top: 10px; }
    .playlist-card button:hover { background: #f50057; }
    #back-btn { padding: 10px 20px; background: #666; color: white; text-decoration: none; border-radius: 3px; display: inline-block; margin: 20px 0; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</head>
<body>
  <div class="container">
    <a id="back-btn" href="/playlist.html">← Back to My Playlists</a>
    <h2>🎧 Explore Public Playlists</h2>
    <div id="explore-list" class="playlist-grid"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/';

    async function loadPublicPlaylists() {
      try {
        const res = await fetch('/api/public-playlists');
        const playlists = await res.json();
        const list = document.getElementById('explore-list');
        
        if (playlists.length === 0) {
          list.innerHTML = '<p style="color: #999; grid-column: 1/-1;">No public playlists yet.</p>';
          return;
        }

        list.innerHTML = playlists.map(p => `
          <div class="playlist-card">
            <h4>${p.name}</h4>
            <p>By: ${p.email}</p>
            <p>📊 ${p.songCount} songs</p>
            <button onclick="viewPlaylist('${p.email}', '${p.name}')">Play Playlist</button>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('explore-list').textContent = 'Error loading playlists: ' + err.message;
      }
    }

    function viewPlaylist(email, name) {
      // Note: This would need a proper shared playlist view
      alert('Viewing ' + name + ' by ' + email);
    }

    loadPublicPlaylists();
  </script>
</body>
</html>
