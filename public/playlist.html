<!DOCTYPE html>
<html>
<head>
  <title>Your Playlist</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    .song-list { margin: 20px 0; }
    .song-item { background: #1a1a1a; padding: 10px; margin: 5px 0; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
    .song-item button { margin-left: 10px; padding: 5px 10px; background: #ff4081; color: white; border: none; border-radius: 3px; cursor: pointer; }
    .song-item button:hover { background: #f50057; }
    .playlist-select { padding: 10px; margin: 10px 0; }
    .upload-section { background: #262626; padding: 20px; border-radius: 8px; margin: 20px 0; }
    #logout { background: #d32f2f; padding: 10px 20px; margin-top: 20px; }
    #logout:hover { background: #b71c1c; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</head>
<body>
  <div class="container">
    <h2>🎵 My Playlists</h2>
    <p id="welcome" style="color: #80d8ff;">Welcome, <strong id="userEmail"></strong></p>

    <div class="upload-section">
      <h3>Upload Song</h3>
      <form id="upload-form">
        <input type="file" id="song" accept="audio/*" required>
        <select id="playlist-select" required>
          <option value="">Select or create playlist</option>
        </select>
        <button type="submit">Upload & Add to Playlist</button>
      </form>
      <div id="upload-status" style="margin-top: 10px; color: #4fc3f7;"></div>
    </div>

    <div>
      <h3>Create New Playlist</h3>
      <input type="text" id="new-playlist-name" placeholder="Playlist name" style="padding: 8px; width: 200px;">
      <button onclick="createPlaylist()" style="padding: 8px 15px; background: #4fc3f7; color: #000; border: none; border-radius: 3px; cursor: pointer;">Create</button>
    </div>

    <h3>Songs in Playlist</h3>
    <div id="songs-list" class="song-list"></div>

    <a href="/explore" style="display: inline-block; margin: 20px 0; padding: 10px 20px; background: #81c784; color: #000; text-decoration: none; border-radius: 5px; font-weight: bold;">Explore Playlists →</a>

    <button id="logout" onclick="logout()">Logout</button>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/';

    async function loadProfile() {
      try {
        const res = await fetch('/api/profile', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        document.getElementById('userEmail').textContent = data.email;
      } catch (err) {
        console.error('Profile error:', err);
      }
    }

    async function loadPlaylists() {
      try {
        const res = await fetch('/api/playlists', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const playlists = await res.json();
        const select = document.getElementById('playlist-select');
        select.innerHTML = '<option value="">Select or create playlist</option>';
        Object.keys(playlists).forEach(name => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          select.appendChild(option);
        });
      } catch (err) {
        console.error('Playlists error:', err);
      }
    }

    async function loadSongs() {
      try {
        const playlistName = document.getElementById('playlist-select').value || null;
        const url = playlistName ? `/api/playlist?name=${encodeURIComponent(playlistName)}` : '/api/playlist';
        const res = await fetch(url, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        const list = document.getElementById('songs-list');
        
        if (data.songs.length === 0) {
          list.innerHTML = '<p style="color: #999;">No songs yet. Upload one!</p>';
          return;
        }

        list.innerHTML = data.songs.map(song => `
          <div class="song-item">
            <span onclick="playSong('${song}')" style="cursor: pointer; flex: 1;">${song.split('/').pop()}</span>
            <button onclick="removeSong('${data.playlistName}', '${song}')">Remove</button>
            <button onclick="addToFavorites('${song}')">♥ Favorite</button>
          </div>
        `).join('');
      } catch (err) {
        console.error('Songs error:', err);
      }
    }

    async function createPlaylist() {
      const name = document.getElementById('new-playlist-name').value.trim();
      if (!name) {
        alert('Please enter a playlist name');
        return;
      }

      try {
        const res = await fetch('/api/create-playlist', {
          method: 'POST',
          headers: { 
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (res.ok) {
          alert('Playlist created!');
          document.getElementById('new-playlist-name').value = '';
          loadPlaylists();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Error creating playlist: ' + err.message);
      }
    }

    async function removeSong(playlistName, song) {
      try {
        await fetch('/api/remove-from-playlist', {
          method: 'POST',
          headers: { 
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name: playlistName, song })
        });
        loadSongs();
      } catch (err) {
        alert('Error removing song: ' + err.message);
      }
    }

    async function addToFavorites(song) {
      try {
        await fetch('/api/favorites', {
          method: 'POST',
          headers: { 
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ song })
        });
        alert('Added to favorites!');
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    function playSong(song) {
      localStorage.setItem('lastPlayed', song);
      window.location.href = `/play.html?song=${encodeURIComponent(song)}`;
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/';
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('song').files[0];
      const playlistName = document.getElementById('playlist-select').value;

      if (!file) {
        alert('Please select a file');
        return;
      }

      if (!playlistName) {
        alert('Please select or create a playlist');
        return;
      }

      const formData = new FormData();
      formData.append('song', file);

      try {
        document.getElementById('upload-status').textContent = 'Uploading...';
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: formData
        });

        const data = await res.json();
        if (res.ok) {
          await fetch('/api/add-to-playlist', {
            method: 'POST',
            headers: { 
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name: playlistName, song: data.songUrl })
          });
          document.getElementById('upload-status').textContent = `✓ Upload successful: ${data.filename}`;
          document.getElementById('song').value = '';
          loadSongs();
        } else {
          document.getElementById('upload-status').textContent = `✗ Error: ${data.error}`;
        }
      } catch (err) {
        document.getElementById('upload-status').textContent = `✗ Error: ${err.message}`;
      }
    });

    document.getElementById('playlist-select').addEventListener('change', loadSongs);

    loadProfile();
    loadPlaylists();
    loadSongs();
  </script>
</body>
</html>
